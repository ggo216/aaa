<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AAA">
<meta name="format-detection" content="telephone=no">
<title>AAA</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=20260806">
</head>
<body>
<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <section id="homeScreen" class="screen">
    <div class="homeCard">
      <div class="brand homeBrand">AAA</div>
      <div class="brandSub">TOWER DEFENSE</div>
      <div class="bestWaveRow"><span data-icon="wave"></span>최고 웨이브 <b id="bestWaveLabel">0</b></div>
      <button id="goGameBtn" class="primaryBtn">게임 시작</button>
      <button id="goCollectionBtn" class="secondaryBtn">카드함</button>
      <button id="goLabBtn" class="secondaryBtn">연구실</button>

      <div id="authBlock">
        <div id="authSignedOut">
          <button id="googleSignInBtn" class="googleBtn">
            <span class="googleG">G</span>Google로 로그인
          </button>
        </div>
        <div id="authSignedIn" class="hidden">
          <div id="authUserName" class="authUserName"></div>
          <button id="signOutBtn" class="ghostBtn">로그아웃</button>
        </div>
        <div id="cloudStatus" class="cloudStatus">로그인하면 다른 기기에서도 이어할 수 있어요</div>
      </div>
    </div>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="gameScreen" class="screen hidden">
    <header id="topbar">
      <button class="navBtn" id="gameHomeBtn" data-icon="home" title="홈으로"></button>
      <button class="navBtn" id="gameCollBtn" data-icon="folder" title="카드함"></button>
      <button class="navBtn" id="gameLabBtn" data-icon="flask" title="연구실"></button>
      <div class="brandWrap">
        <div class="brand">AAA</div>
        <div class="brandSub">TOWER DEFENSE</div>
      </div>
      <div class="statRow">
        <div class="stat wave"><span class="statBadge" data-icon="wave"></span><div class="statText"><b id="waveLabel">0</b><small>웨이브</small></div></div>
        <div class="stat timer"><span class="statBadge" data-icon="clock"></span><div class="statText"><b id="timerLabel">--</b><small>남은 시간</small></div></div>
        <div class="stat gold"><span class="statBadge" data-icon="coin"></span><div class="statText"><b id="goldLabel">0</b><small>골드</small></div></div>
        <div class="stat swarm"><span class="statBadge" data-icon="swarm"></span><div class="statText"><b id="swarmLabel">0/50</b><small>필드 몬스터</small></div></div>
      </div>
    </header>
    <div class="speedGroup">
      <span class="speedLabel" data-icon="fastfwd" data-icon-label="배속"></span>
      <button class="speedBtn" data-speed="1">1x</button>
      <button class="speedBtn" data-speed="2">2x</button>
      <button class="speedBtn" data-speed="3">3x</button>
      <button class="speedBtn" data-speed="5">5x</button>
      <button class="speedBtn" data-speed="10">10x</button>
    </div>

    <main id="layout">
      <section id="fieldWrap">
        <div id="wavePrepOverlay" class="overlay hidden">
          <div class="overlayBox">
            <div id="prepText">웨이브 시작까지</div>
            <div id="prepCount">3</div>
          </div>
        </div>
        <div id="gameOverOverlay" class="overlay hidden">
          <div class="overlayBox">
            <div>GAME OVER</div>
            <div id="finalWave"></div>
            <div id="finalGoldGain"></div>
            <button id="restartBtn">다시 시작</button>
          </div>
        </div>
        <canvas id="field" width="484" height="484"></canvas>
        <div id="fieldFlash"></div>
        <div id="waveToast" class="hidden"></div>
        <div id="startRow">
          <button id="startBtn">웨이브 시작</button>
        </div>
      </section>

      <div id="benchWrap">
        <div class="panelTitle"><span class="ptIcon" data-icon="bag"></span>대기 유닛</div>
        <div id="benchList" class="cardGrid"></div>
      </div>

      <aside id="sidePanel">
        <div class="row2">
          <div class="panelBlock" id="summonBlock">
            <div class="panelTitle"><span class="ptIcon" data-icon="sparkle"></span>소환</div>
            <button id="summonBtn">소환 (10 골드)</button>
          </div>

          <div class="panelBlock" id="selectedBlock">
            <div class="panelTitle"><span class="ptIcon" data-icon="target"></span>유닛 관리</div>
            <div id="selectedInfo" class="selInfo"></div>
            <div class="selActions">
              <button id="sellBtn" disabled>판매</button>
              <button id="bulkSellBtn">일괄 판매</button>
              <select id="bulkSellGrade" title="일괄 판매 기준 등급"></select>
            </div>
          </div>
        </div>

        <div class="panelBlock" id="upgradeBlock">
          <div class="panelTitle"><span class="ptIcon" data-icon="bolt"></span>유닛 강화</div>
          <div id="gameDeckList" class="upgradeList"></div>
        </div>
      </aside>
    </main>
  </section>

  <!-- ============ COLLECTION + GACHA SCREEN ============ -->
  <section id="collectionScreen" class="screen hidden">
    <header id="collectionTopbar">
      <button class="navBtn" id="collHomeBtn" data-icon="home" title="홈으로"></button>
      <div class="brandWrap">
        <div class="brand">카드함</div>
        <div class="brandSub">DECK &amp; GACHA</div>
      </div>
      <div class="statRow">
        <div class="stat coin"><span class="statBadge" data-icon="ticket"></span><div class="statText"><b id="collCoinLabel">0</b><small>카드코인</small></div></div>
        <div class="stat gem"><span class="statBadge" data-icon="gem"></span><div class="statText"><b id="collGemLabel">0</b><small>특수재화</small></div></div>
      </div>
      <button class="navBtn" id="collLabBtn" data-icon="flask" title="연구실"></button>
      <button class="navBtn ghostNav" id="collGameBtn" data-icon="wave" title="게임으로 돌아가기"></button>
    </header>

    <div id="collectionLayout">
      <div class="panelBlock" id="deckPanel">
        <div class="panelTitle"><span class="ptIcon" data-icon="target"></span>덱 구성 <span id="deckCountLabel" class="deckCount"></span></div>
        <div id="deckLockNotice" class="lockNotice hidden"><span data-icon="lock"></span>게임 진행 중에는 덱을 변경할 수 없습니다</div>
        <div id="deckSlots" class="deckSlots"></div>
        <div id="setBonusInfo" class="setBonusInfo"></div>
      </div>

      <div class="panelBlock" id="gachaPanel">
        <div class="panelTitle"><span class="ptIcon" data-icon="dice"></span>카드 뽑기</div>
        <button id="gachaNormalBtn">일반 뽑기 (15 카드코인)</button>
        <button id="gachaGemBtn">고급 뽑기 (5 특수재화)</button>
        <button id="gachaBulkNormalBtn" class="ghostBtn">일반 뽑기 10연 (150 카드코인)</button>
      </div>
    </div>

    <div class="panelBlock" id="collectionListPanel">
      <div class="panelTitle"><span class="ptIcon" data-icon="folder"></span>보유 카드 전체
        <button id="bulkEnhanceBtn" class="bulkEnhanceBtn">일괄 강화</button>
      </div>
      <div id="collectionList" class="collGrid"></div>
    </div>
  </section>

  <!-- ============ RESEARCH LAB (SKILL TREE) SCREEN ============ -->
  <section id="labScreen" class="screen hidden">
    <header id="labTopbar">
      <button class="navBtn" id="labHomeBtn" data-icon="home" title="홈으로"></button>
      <div class="brandWrap">
        <div class="brand">연구실</div>
        <div class="brandSub">SKILL TREE</div>
      </div>
      <div class="stat coin"><span class="statBadge" data-icon="flask"></span><div class="statText"><b id="labTokenLabel">0</b><small id="labTokenSubLabel">토큰</small></div></div>
      <div class="stat gem"><span class="statBadge" data-icon="gem"></span><div class="statText"><b id="labMasteryLabel">0</b><small>공용 마스터리</small></div></div>
      <button class="navBtn ghostNav" id="labCollBtn" data-icon="folder" title="카드함으로"></button>
    </header>

    <div id="labSubTabs"></div>

    <div id="labTreePanel" class="panelBlock">
      <div id="labTreeGrid"></div>
    </div>
  </section>

  <div id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260806"></script>
<script src="icons.js?v=20260806"></script>
<script src="data.js?v=20260806"></script>
<script src="game.js?v=20260806"></script>
<script src="cloud.js?v=20260806"></script>
</body>
</html>
